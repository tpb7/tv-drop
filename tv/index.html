<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Drop</title>
<style>
  /* Colours live here. Change them once and the whole screen follows.  <-- TWEAK */
  :root {
    --ink: #0e1020;
    --panel: #181b33;
    --line: #2a2e52;
    --text: #f4f1ea;
    --soft: #a9adc9;
    --accent: #ffb547;
    --good: #6ee7c8;
    --bad: #ff7a7a;
  }
  * { box-sizing: border-box; }
  /* Sizes use "vw" (a slice of the screen width) so the layout looks the same on a TV and in a laptop browser. */
  html { font-size: 1.0417vw; }            /* 1rem = 20px on a 1920-wide TV */
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: var(--ink); color: var(--text);
    font-family: "LG Smart UI", system-ui, -apple-system, "Segoe UI", sans-serif;
    cursor: none;
  }

  .screen { position: absolute; inset: 0; opacity: 0; visibility: hidden; transition: opacity .5s ease, visibility 0s linear .5s; }
  .screen.on { opacity: 1; visibility: visible; transition: opacity .5s ease; }

  /* ---------- code screen ---------- */
  #codeScreen { display: flex; align-items: center; justify-content: space-between; padding: 0 9vw 0 8vw; }
  .words { max-width: 46vw; }
  .kicker { font-size: 1.1rem; letter-spacing: .32em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
  h1 { font-size: 5.2rem; line-height: 1.02; letter-spacing: -0.03em; margin: 1.2rem 0 2.6rem; font-weight: 800; }
  ol { list-style: none; margin: 0; padding: 0; counter-reset: step; }
  ol li { counter-increment: step; display: flex; align-items: center; gap: 1.2rem; font-size: 1.7rem; color: var(--soft); margin: 1.1rem 0; }
  ol li::before {
    content: counter(step); flex: none; width: 2.6rem; height: 2.6rem; border-radius: 50%;
    border: .12rem solid var(--line); color: var(--text); font-weight: 700; font-size: 1.25rem;
    display: flex; align-items: center; justify-content: center;
  }

  .qrWrap { position: relative; flex: none; }
  .qrWrap::before {                /* the flat amber block peeking out behind the code */
    content: ""; position: absolute; inset: 0; border-radius: 2.2rem; background: var(--accent);
    transform: translate(1.3rem, 1.3rem);
  }
  .qrCard { position: relative; background: #fff; border-radius: 2.2rem; padding: 2rem; line-height: 0; }
  .qrCard canvas { width: 24vw; height: 24vw; image-rendering: pixelated; }

  .pill {
    position: absolute; left: 8vw; bottom: 7vh; display: flex; align-items: center; gap: .8rem;
    padding: .7rem 1.3rem; border-radius: 99rem; background: var(--panel); border: .08rem solid var(--line);
    font-size: 1.15rem; color: var(--soft);
  }
  .dot { width: .8rem; height: .8rem; border-radius: 50%; background: var(--soft); }
  .dot.wait { background: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
  .dot.good { background: var(--good); }
  .dot.bad { background: var(--bad); }
  @keyframes pulse { 50% { opacity: .3; } }

  /* ---------- photo screen ---------- */
  #photoScreen { background: #000; }
  #photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transform: scale(1.03); transition: transform 1.2s cubic-bezier(.2,.7,.2,1); }
  #photoScreen.on #photo { transform: scale(1); }
  .chip {
    position: absolute; right: 3vw; bottom: 5vh; display: flex; align-items: center; gap: 1rem;
    background: rgba(14,16,32,.86); border: .08rem solid var(--line); border-radius: 1.4rem; padding: .8rem 1.2rem .8rem .8rem;
    font-size: 1.05rem; color: var(--soft); transition: opacity .4s ease;
  }
  .chip.hidden { opacity: 0; }
  .chip canvas { width: 6.5vw; height: 6.5vw; background: #fff; border-radius: .6rem; padding: .35rem; image-rendering: pixelated; }
  .chip b { display: block; color: var(--text); font-size: 1.2rem; margin-bottom: .2rem; }

  /* thin bar across the top while a photo is arriving */
  #progress { position: absolute; left: 0; top: 0; height: .45rem; width: 0%; background: var(--accent); opacity: 0; transition: width .2s ease, opacity .4s ease; z-index: 5; }
  #progress.on { opacity: 1; }

  /* ---------- setup / problem screen ---------- */
  #noteScreen { display: flex; flex-direction: column; justify-content: center; padding: 0 12vw; }
  #noteScreen h1 { font-size: 4rem; margin: 1rem 0 1.6rem; }
  #noteScreen p { font-size: 1.7rem; line-height: 1.5; color: var(--soft); margin: 0 0 1rem; max-width: 60vw; }
  #noteScreen code { color: var(--accent); font-family: ui-monospace, Menlo, Consolas, monospace; }
</style>
</head>
<body>
  <div id="progress"></div>

  <section class="screen" id="codeScreen">
    <div class="words">
      <div class="kicker">TV Drop</div>
      <h1>Send a photo to this screen</h1>
      <ol>
        <li>Open your phone's camera</li>
        <li>Point it at the code and tap the link</li>
        <li>Choose a photo</li>
      </ol>
    </div>
    <div class="qrWrap"><div class="qrCard"><canvas id="qrBig"></canvas></div></div>
    <div class="pill"><span class="dot wait" id="dot"></span><span id="status">Opening the room…</span></div>
  </section>

  <section class="screen" id="photoScreen">
    <img id="photo" alt="">
    <div class="chip" id="chip"><canvas id="qrSmall"></canvas><div><b>Send another</b>Scan with your phone</div></div>
  </section>

  <section class="screen" id="noteScreen">
    <div class="kicker" id="noteKicker">Setup</div>
    <h1 id="noteTitle"></h1>
    <p id="noteLine1"></p>
    <p id="noteLine2"></p>
  </section>

  <script src="config.js"></script>
  <script src="supabase.js"></script>
  <script src="qrcode.js"></script>
  <script src="relay.js"></script>
  <script src="tv.js"></script>
</body>
</html>
